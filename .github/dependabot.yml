# Dependabot: еженедельные PR с обновлениями зависимостей.
# Мелкие обновления (minor/patch) объединяются в один PR на экосистему,
# чтобы не засыпать репозиторий. Мажорные версии приходят отдельными PR.
version: 2
updates:

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]
